[project]
name = "fin-terminal"
version = "0.1.0"
description = "Local multi-market financial analysis and forecasting desktop terminal"
requires-python = ">=3.11"
dependencies = [
  "pandas>=3.0",
  "numpy>=2.5",
  "yfinance>=1.7",
  "scikit-learn>=1.9",
  "PyYAML>=6.0",
  "pywebview>=6.2",
]

[tool.setuptools.packages.find]
where = ["src"]
